name: Render Viral Test Reel

on:
  push:
    paths:
      - 'data/viral_test_request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kpop-viral-test-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install downloader dependencies
        run: pip install requests yt-dlp

      - name: Render viral hybrid audio test
        run: python scripts/render_viral_hybrid_audio_test.py --payload data/viral_test_request.json

      - name: Upload viral test package
        uses: actions/upload-artifact@v4
        with:
          name: viral-test-output
          path: |
            out/viral_test_*.mp4
            out/viral_test_*_cover.jpg
            out/viral_test_*_manifest.json
          if-no-files-found: error
          retention-days: 14
