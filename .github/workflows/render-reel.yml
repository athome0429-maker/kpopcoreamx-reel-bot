name: Render K-pop Reel

on:
  workflow_dispatch:
    inputs:
      payload_path:
        description: 'JSON payload path'
        required: false
        default: 'data/render_request.json'
  push:
    paths:
      - 'data/render_request.json'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Pick payload path
        id: payload
        run: |
          if [ -n "${{ github.event.inputs.payload_path }}" ]; then
            echo "path=${{ github.event.inputs.payload_path }}" >> $GITHUB_OUTPUT
          else
            echo "path=data/render_request.json" >> $GITHUB_OUTPUT
          fi

      - name: Render reel
        run: python scripts/render_reel.py --payload "${{ steps.payload.outputs.path }}"

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-output
          path: out/*.mp4
