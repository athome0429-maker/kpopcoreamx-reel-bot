name: Render K-pop Reel

on:
  workflow_dispatch:
    inputs:
      payload_path:
        description: 'JSON payload path'
        required: false
        default: 'data/render_request.json'
  push:
    paths:
      - 'data/render_request.json'

permissions:
  contents: read

concurrency:
  group: kpop-reel-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Pick payload path
        id: payload
        run: |
          if [ -n "${{ github.event.inputs.payload_path }}" ]; then
            echo "path=${{ github.event.inputs.payload_path }}" >> $GITHUB_OUTPUT
          else
            echo "path=data/render_request.json" >> $GITHUB_OUTPUT
          fi

      - name: Normalize payload
        run: python scripts/normalize_payload.py --input "${{ steps.payload.outputs.path }}" --output data/_render_normalized.json

      - name: Render and verify reel
        run: python scripts/render_reel.py --payload data/_render_normalized.json

      - name: Upload Reel package
        uses: actions/upload-artifact@v4
        with:
          name: reel-output
          path: |
            out/*.mp4
            out/*_cover.jpg
            out/*_manifest.json
          if-no-files-found: error
          retention-days: 14
