name: Render K-pop Reel

on:
  workflow_dispatch:
    inputs:
      payload_path:
        description: 'JSON payload path'
        required: false
        default: 'data/render_request.json'
  push:
    paths:
      - 'data/render_request.json'

permissions:
  contents: read

concurrency:
  group: kpop-reel-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install browser screenshot fallback
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Pick payload path
        id: payload
        run: |
          if [ -n "${{ github.event.inputs.payload_path }}" ]; then
            echo "path=${{ github.event.inputs.payload_path }}" >> $GITHUB_OUTPUT
          else
            echo "path=data/render_request.json" >> $GITHUB_OUTPUT
          fi

      - name: Normalize payload
        run: python scripts/normalize_payload.py --input "${{ steps.payload.outputs.path }}" --output data/_render_normalized.json

      - name: Cache and verify source images once
        run: python scripts/cache_source_images.py

      - name: Render and verify reel
        run: python scripts/render_reel.py --payload data/_render_normalized.json

      - name: Add v3 strategy metadata to manifest
        run: python scripts/enrich_manifest.py --payload data/_render_normalized.json --out-dir out

      - name: Report render failure
        if: failure()
        run: |
          echo "::error::Reel pipeline failed. Check the failed step above for image HTTP errors, payload validation, FFmpeg, or artifact issues."
          echo "Failed run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-diagnostics
          path: |
            tmp/source_cache/sources.json
            data/_render_normalized.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Reel package
        uses: actions/upload-artifact@v4
        with:
          name: reel-output
          path: |
            out/*.mp4
            out/*_cover.jpg
            out/*_manifest.json
          if-no-files-found: error
          retention-days: 14
